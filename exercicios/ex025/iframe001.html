<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe{
            width: 400px;
            height: 400px;
            border: 1px solid black

            /*Na hieraquia de estilos, o que vem primeiro é o "css style" de pois o height dentro do próprio código do iframe e por ultimo (se não tiver nada) o tamanho padrão de 300x150*/
        }
    </style>
</head>
<body>
    <h1>Testando o uso de Iframes</h1>

    <!--Tamanho padrão de um iframe é de 300x150-->
    <!--O scolling serve para desativar ou ativar a barra de rolagem no iframe "yes" para ter rolagem e "no" para não ter rolagem. Vai funcionar dependendo do navegador-->
    <!--framborder para ter bordas ou não no iframe. Se tiver com o valor zero, significa que não tera bordas. Qualquer outro valor deixará o iframe com bordas-->
    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe>
        para aprender a programar
    </p>
    <p>
         Acessando outro site 

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="400" scolling="no">
            <a href="https://github.com/gustavoguanabara" target="_blank">Github</a>
        </iframe>

        para programar
    </p>
</body>
</html>
